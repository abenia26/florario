<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · Florario</title>
<meta name="theme-color" content="#F2C230">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-12 -12 24 24'%3E%3Cg fill='%23F2C230'%3E%3Cellipse cy='-5.5' rx='2.4' ry='5.5'/%3E%3Cellipse cy='-5.5' rx='2.4' ry='5.5' transform='rotate(45)'/%3E%3Cellipse cy='-5.5' rx='2.4' ry='5.5' transform='rotate(90)'/%3E%3Cellipse cy='-5.5' rx='2.4' ry='5.5' transform='rotate(135)'/%3E%3Cellipse cy='-5.5' rx='2.4' ry='5.5' transform='rotate(180)'/%3E%3Cellipse cy='-5.5' rx='2.4' ry='5.5' transform='rotate(225)'/%3E%3Cellipse cy='-5.5' rx='2.4' ry='5.5' transform='rotate(270)'/%3E%3Cellipse cy='-5.5' rx='2.4' ry='5.5' transform='rotate(315)'/%3E%3C/g%3E%3Ccircle r='2.8' fill='%232A2F25'/%3E%3C/svg%3E">
<link rel="preload" href="/fuentes/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 400 800; font-display: swap; src: url("/fuentes/bricolage-grotesque-latin.woff2") format("woff2"); }
  @font-face { font-family: "DM Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fuentes/dm-mono-400-latin.woff2") format("woff2"); }
  @font-face { font-family: "DM Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url("/fuentes/dm-mono-500-latin.woff2") format("woff2"); }
  /* Mismos tokens que index.html */
  :root {
    --bg: #F6F4EC;
    --surface: #FFFFFF;
    --ink: #1B2118;
    --muted: #525A4D;
    --line: #DCDDD0;
    --stem: #2F6B45;
    --pistil: #2A2F25;
    --petal-edge: rgba(27, 33, 24, .32);
    --blob-1: rgba(238, 127, 168, .34);
    --blob-2: rgba(242, 194, 48, .34);
    --blob-3: rgba(138, 79, 216, .16);
    --font: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "DM Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10130F; --surface: #181C16; --ink: #ECF0E6; --muted: #A2AA9B; --line: #2C3229;
      --stem: #7FC495; --pistil: #151812; --petal-edge: rgba(0, 0, 0, .5);
      --blob-1: rgba(238, 127, 168, .16); --blob-2: rgba(242, 194, 48, .12); --blob-3: rgba(138, 79, 216, .16);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10130F; --surface: #181C16; --ink: #ECF0E6; --muted: #A2AA9B; --line: #2C3229;
    --stem: #7FC495; --pistil: #151812; --petal-edge: rgba(0, 0, 0, .5);
    --blob-1: rgba(238, 127, 168, .16); --blob-2: rgba(242, 194, 48, .12); --blob-3: rgba(138, 79, 216, .16);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    background:
      radial-gradient(40rem 28rem at 6% -4%, var(--blob-1), transparent 70%),
      radial-gradient(36rem 26rem at 96% 6%, var(--blob-2), transparent 70%),
      radial-gradient(34rem 26rem at 50% 110%, var(--blob-3), transparent 70%),
      var(--bg);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 560px; display: grid; justify-items: center; text-align: center; gap: 14px; }
  .scene { width: min(260px, 70vw); height: auto; overflow: visible; }
  .petal { stroke: var(--petal-edge); stroke-width: .6; }
  .pistil { fill: var(--pistil); }
  .stem { stroke: var(--stem); stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .leaf { fill: var(--stem); opacity: .75; }
  .pot { fill: #C9774A; }
  .pot-rim { fill: #B0643A; }
  .ground { stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; }
  .head { transform-origin: 0 0; animation: droop 3.2s ease-in-out infinite alternate; }
  .fall { animation: fall 4.5s ease-in infinite; }
  .fall.b { animation-delay: 1.6s; }
  .fall.c { animation-delay: 3s; }
  @keyframes droop { from { transform: rotate(-4deg); } to { transform: rotate(6deg); } }
  @keyframes fall {
    0% { transform: translate(0, 0) rotate(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(-18px, 92px) rotate(160deg); opacity: 0; }
  }
  .code {
    margin: 0;
    font-family: var(--mono);
    font-size: .8rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 3rem);
    line-height: 1.04;
    font-weight: 800;
    letter-spacing: -.035em;
    text-wrap: balance;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(90deg, #E8475F, #F28C1B 50%, #E0A400);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.lede { margin: 0; max-width: 42ch; color: var(--muted); font-size: 1.05rem; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: .95rem;
    text-decoration: none;
    transition: transform .15s, border-color .15s;
  }
  .btn:hover { transform: translateY(-2px); border-color: var(--muted); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--stem); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .head, .fall { animation: none; }
    .fall { display: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
<main>
  <svg class="scene" viewBox="-80 -100 170 170" aria-hidden="true">
    <line class="ground" x1="-70" y1="62" x2="70" y2="62"/>
    <!-- Maceta -->
    <path class="pot" d="M-26 22 H26 L20 62 H-20 Z"/>
    <rect class="pot-rim" x="-30" y="14" width="60" height="11" rx="3"/>
    <!-- Tallo doblado -->
    <path class="stem" d="M0 14 C0 -46 14 -80 40 -76 C56 -73 60 -58 56 -44"/>
    <path class="leaf" d="M1 -14 C-18 -22 -26 -12 -30 -4 C-18 -4 -8 -6 1 -14 Z"/>
    <!-- Cabeza de la flor, mirando hacia abajo -->
    <g transform="translate(56 -40)">
      <g class="head" id="head"></g>
    </g>
    <!-- Pétalos que caen -->
    <g transform="translate(60 -28)"><ellipse class="petal fall" rx="2.6" ry="6" fill="#EE7FA8"/></g>
    <g transform="translate(50 -30)"><ellipse class="petal fall b" rx="2.6" ry="6" fill="#EE7FA8"/></g>
    <g transform="translate(64 -36)"><ellipse class="petal fall c" rx="2.6" ry="6" fill="#EE7FA8"/></g>
  </svg>

  <p class="code">Error 404</p>
  <h1>Esta página se ha <em>marchitado</em>.</h1>
  <p class="lede">La dirección que buscas no existe o ha cambiado. Las flores siguen en el calendario, con sus fechas, su historia y su foto.</p>
  <div class="actions">
    <a class="btn primary" id="home" href="/">Volver al calendario</a>
    <a class="btn" id="random" href="/">Ver una flor al azar</a>
  </div>
</main>

<script>
(() => {
  // Flor caída: pétalos rosas girados hacia abajo
  let s = "";
  for (let k = 0; k < 7; k++) {
    if (k === 2 || k === 5) continue; // le faltan pétalos
    s += `<ellipse class="petal" cx="0" cy="-8" rx="4" ry="8" transform="rotate(${k * 360 / 7}) translate(0 3)" fill="#EE7FA8"/>`;
  }
  document.getElementById("head").innerHTML = s + `<circle class="pistil" r="4"/>`;

  // En GitHub Pages la web vive en /florario/; en el dominio propio, en la raíz
  const base = location.hostname.endsWith("github.io") ? "/florario/" : "/";
  const ids = ["rose-day", "galentines", "san-valentin", "8m", "amarillas-marzo", "sant-jordi", "muguet", "madre-es",
    "madre-mx", "madre-mayo2", "rose-day-kr", "namorados", "novia", "amor-amistad-co", "amarillas", "novio",
    "madre-ar", "todos-santos", "muertos", "moradas", "hombre", "nochebuena", "guadalupe"];
  document.getElementById("home").href = base;
  document.getElementById("random").href = base + "#" + ids[Math.floor(Math.random() * ids.length)];
})();
</script>
</body>
</html>
