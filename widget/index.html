<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Próxima fecha para regalar flores · Florario</title>
<link rel="canonical" href="https://www.calendariodeflores.com/">
<style>
  :root { --ink: #1B2118; --muted: #525A4D; --bg: #FFFFFF; --line: #DCDDD0; --c: #3F72E0; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ECF0E6; --muted: #A2AA9B; --bg: #181C16; --line: #2C3229; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  .w { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; padding: 14px 16px; border: 1px solid var(--line);
        border-radius: 16px; border-top: 5px solid var(--c); background: color-mix(in srgb, var(--c) 10%, var(--bg)); }
  .k { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .m { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; align-content: center; }
  .n { grid-row: span 2; font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .t { font-weight: 700; font-size: 17px; line-height: 1.2; }
  .f { font-size: 13px; color: var(--muted); }
  a { color: var(--ink); font-size: 13px; font-weight: 600; text-underline-offset: 3px; text-decoration-color: var(--c); text-decoration-thickness: 2px; }
</style>
</head>
<body>
<div class="w">
  <p class="k" id="k">3 de octubre</p>
  <div class="m"><span class="n" id="n">5</span><span class="t" id="t">Día del Novio</span><span class="f" id="f">Flores azules o un ramo de Hot Wheels</span></div>
  <a href="https://www.calendariodeflores.com/" target="_blank" rel="noopener">Calendario de flores · Florario</a>
</div>
<script>
(() => {
  const EV = [{"n":"Rose Day","f":"Rosas","c":"#D7263D","p":[],"m":2,"d":7},{"n":"Galentine’s Day","f":"Ramos para tus amigas","c":"#EE7FA8","p":["ES","MX","AR","CO","CL","PE"],"m":2,"d":13},{"n":"San Valentín","f":"Rosas rojas","c":"#D7263D","p":["ES","MX","AR","CO","CL","PE"],"m":2,"d":14},{"n":"Día Internacional de la Mujer","f":"Mimosa o tulipanes","c":"#F2C230","p":["ES","MX","AR","CO","CL","PE"],"m":3,"d":8},{"n":"Día del Padre","f":"Girasoles o una planta","c":"#F2C230","p":["ES"],"m":3,"d":19},{"n":"Flores amarillas (primavera norte)","f":"Girasoles, tulipanes o rosas amarillas","c":"#F2C230","p":["MX","PE"],"m":3,"d":21},{"n":"Sant Jordi","f":"Una rosa roja y un libro","c":"#D7263D","p":["ES"],"m":4,"d":23},{"n":"Muguet du 1er mai","f":"Lirio de los valles (muguet)","c":"#9DBF9E","p":[],"m":5,"d":1},{"n":"Día de la Madre","f":"Claveles, rosas o peonías","c":"#EE7FA8","p":["ES"],"r":[5,0,1]},{"n":"Día de las Madres","f":"Rosas y claveles","c":"#EE7FA8","p":["MX"],"m":5,"d":10},{"n":"Día de la Madre","f":"Claveles","c":"#EE7FA8","p":["CO","CL","PE"],"r":[5,0,2]},{"n":"Rose Day","f":"Rosas","c":"#EE7FA8","p":[],"m":5,"d":14},{"n":"Día del Maestro","f":"Margaritas, girasoles o una planta pequeña","c":"#F2C230","p":["MX","CO"],"m":5,"d":15},{"n":"Dia dos Namorados","f":"Rosas rojas","c":"#D7263D","p":[],"m":6,"d":12},{"n":"Día del Padre","f":"Girasoles, flores azules o una planta","c":"#3F72E0","p":["MX","AR","CO","CL","PE"],"r":[6,0,3]},{"n":"Día de la Novia","f":"Rosas","c":"#EE7FA8","p":["MX","PE"],"m":8,"d":1},{"n":"Amor y Amistad","f":"Rosas y girasoles","c":"#D7263D","p":["CO"],"r":[9,6,3]},{"n":"Flores amarillas","f":"Girasoles, tulipanes o rosas amarillas","c":"#F2C230","p":["ES","MX","AR","CO","CL","PE"],"m":9,"d":21},{"n":"Día del Novio","f":"Flores azules o un ramo de Hot Wheels","c":"#3F72E0","p":["ES","MX","CO","CL","PE"],"m":10,"d":3},{"n":"Día de la Madre","f":"Rosas y liliums","c":"#EE7FA8","p":["AR"],"r":[10,0,3]},{"n":"Todos los Santos","f":"Crisantemos","c":"#9DBF9E","p":["ES","CO","CL","PE"],"m":11,"d":1},{"n":"Día de Muertos","f":"Cempasúchil","c":"#F28C1B","p":["MX"],"m":11,"d":2},{"n":"Flores moradas","f":"Violetas o cualquier flor morada","c":"#8A4FD8","p":["ES","MX","CO","PE"],"m":11,"d":9},{"n":"Día Internacional del Hombre","f":"Flores azules, girasoles o Hot Wheels","c":"#3F72E0","p":["MX","AR","CO","CL","PE"],"m":11,"d":19},{"n":"Día Nacional de la Nochebuena","f":"Flor de Nochebuena (cuetlaxóchitl)","c":"#D7263D","p":["MX"],"m":12,"d":8},{"n":"Virgen de Guadalupe","f":"Rosas","c":"#D7263D","p":["MX"],"m":12,"d":12}];
  const M = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const pais = (new URLSearchParams(location.search).get("pais") || "").toUpperCase();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const nth = (y, m, wd, n) => { const f = new Date(y, m - 1, 1); return new Date(y, m - 1, 1 + (wd - f.getDay() + 7) % 7 + (n - 1) * 7); };
  const at = (e, y) => e.r ? nth(y, e.r[0], e.r[1], e.r[2]) : new Date(y, e.m - 1, e.d);
  let best = null;
  for (const e of EV) {
    if (pais && !e.p.includes(pais)) continue;
    for (const y of [today.getFullYear(), today.getFullYear() + 1]) {
      const d = at(e, y), n = Math.round((d - today) / 864e5);
      if (n >= 0 && (!best || n < best.n)) best = { e, d, n };
    }
  }
  if (!best) return;
  document.documentElement.style.setProperty("--c", best.e.c);
  document.getElementById("k").textContent = `${best.d.getDate()} de ${M[best.d.getMonth()]} · ${best.n === 0 ? "es hoy" : best.n === 1 ? "falta 1 día" : `faltan ${best.n} días`}`;
  document.getElementById("n").textContent = best.n === 0 ? "¡Hoy!" : best.n;
  document.getElementById("t").textContent = best.e.n;
  document.getElementById("f").textContent = best.e.f;
})();
</script>
</body>
</html>
